<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#070708">
  <link rel="icon" href="/img/favicon.png" type="image/png">
  <link rel="apple-touch-icon" href="/img/icone-512.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Saira:ital,wght@1,600;1,700;1,800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <script src="/js/app.js"></script>
  <title>Blog | DFR 3D Impressão</title>
</head>
<body>
<main id="conteudo" class="container">
  <div class="post">
    <p style="margin:0;font-size:.9rem"><a href="/blog" class="suave">← Blog</a></p>
    <article id="post"><p class="carregando">Carregando…</p></article>
  </div>
  <section id="extras" class="secao" style="padding-top:0"></section>
</main>
<script>
  const { esc } = DFR;
  const slug = decodeURIComponent(location.pathname.split('/')[2] || '');
  DFR.api('/api/blog/' + encodeURIComponent(slug)).then(async (p) => {
    const cfg = await DFR.config();
    document.title = `${p.titulo} | Blog DFR 3D Impressão`;
    const url = location.href;
    document.getElementById('post').innerHTML = `
      ${p.categoria ? `<span class="etiqueta" style="margin:1.5rem 0 .5rem;display:block">${esc(p.categoria)}</span>` : '<div style="height:1.5rem"></div>'}
      <h1>${esc(p.titulo)}</h1>
      <p class="suave" style="margin:0">${p.publicado_em ? new Date(p.publicado_em + 'T12:00').toLocaleDateString('pt-BR', { day: '2-digit', month: 'long', year: 'numeric' }) : ''} · ${p.leitura_min} min de leitura</p>
      ${p.capa ? `<div class="capa-post"><img src="${esc(p.capa)}" alt=""></div>` : '<div style="height:1.5rem"></div>'}
      <div class="post-corpo">${p.html}</div>
      <div style="display:flex;gap:.6rem;flex-wrap:wrap;margin-top:2.5rem;padding-top:1.5rem;border-top:1px solid var(--linha);align-items:center">
        <span class="suave">Compartilhe:</span>
        <a class="btn pequeno verde" href="https://wa.me/?text=${encodeURIComponent(p.titulo + ' ' + url)}" target="_blank" rel="noopener"><span>WhatsApp</span></a>
        <button class="btn pequeno contorno" id="copiar-link"><span>Copiar link</span></button>
      </div>`;
    document.getElementById('copiar-link').onclick = () => navigator.clipboard.writeText(url).then(() => DFR.toast('Link copiado!'));
    document.getElementById('extras').innerHTML = `
      ${p.produtos.length ? `<div class="secao-topo"><h2>Produtos <span class="vermelho">do post</span></h2></div><div class="carrossel">${p.produtos.map(DFR.cardProduto).join('')}</div>` : ''}
      <div class="caixa" style="margin:2.5rem 0;display:flex;gap:1.5rem;align-items:center;justify-content:space-between;flex-wrap:wrap">
        <div><h3 style="margin:0">Quer algo parecido?</h3><p class="suave" style="margin:.3rem 0 0">A gente imprime sob medida para você.</p></div>
        <div style="display:flex;gap:.6rem;flex-wrap:wrap"><a class="btn" href="/encomenda"><span>Pedir orçamento</span></a>${cfg.whatsapp ? `<a class="btn verde" href="https://wa.me/${cfg.whatsapp}?text=${encodeURIComponent('Olá! Li o post "' + p.titulo + '" no blog da DFR 3D.')}" target="_blank" rel="noopener"><span>WhatsApp</span></a>` : ''}</div>
      </div>
      ${p.outros.length ? `<div class="secao-topo"><h2>Leia <span class="vermelho">também</span></h2></div><div class="grade-blog">${p.outros.map((o) => `<a class="card-post" href="/blog/${esc(o.slug)}"><div class="capa">${DFR.fotoOuPlaceholder(o.capa, o.titulo)}</div><div class="info"><h3>${esc(o.titulo)}</h3><p>${esc(o.resumo)}</p></div></a>`).join('')}</div>` : ''}`;
  }).catch((e) => {
    document.getElementById('post').innerHTML = `<div class="vazio"><h1>Post não encontrado</h1><p class="suave">${esc(e.message)}</p><a class="btn" href="/blog"><span>Ver o blog</span></a></div>`;
  });
</script>
</body>
</html>
