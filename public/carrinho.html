<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#070708">
  <link rel="icon" href="/img/favicon.png" type="image/png">
  <link rel="apple-touch-icon" href="/img/icone-512.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Saira:ital,wght@1,600;1,700;1,800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <script src="/js/app.js"></script>
  <title>Carrinho | DFR 3D Impressão</title>
</head>
<body>
<main id="conteudo" class="container">
  <div id="carrinho"></div>
</main>
<script>
  const { esc, brl, carrinho } = DFR;
  function render() {
    const itens = carrinho.ler();
    const el = document.getElementById('carrinho');
    if (!itens.length) {
      el.innerHTML = `<div class="vazio"><h1>Carrinho vazio</h1><p class="suave">Que tal dar uma olhada nos produtos?</p><a class="btn" href="/produtos"><span>Ver produtos</span></a></div>`;
      return;
    }
    el.innerHTML = `
      <div class="layout-checkout">
        <div class="caixa">
          <h1 style="font-size:2rem">Carrinho</h1>
          ${itens.map((i, idx) => `
            <div class="item-carrinho">
              <div class="mini">${DFR.fotoOuPlaceholder(i.imagem, i.nome)}</div>
              <div>
                <a href="/produto/${esc(i.slug)}">${esc(i.nome)}</a>
                ${DFR.detalhesItem(i) ? `<div class="suave" style="font-size:.88rem">${DFR.detalhesItem(i)}</div>` : ''}
                <div class="suave" style="font-size:.88rem">${brl(i.preco_cents)} cada</div>
                <div style="display:flex;gap:1rem;align-items:center;margin-top:.5rem">
                  <div class="qtd"><button type="button" data-idx="${idx}" data-d="-1" aria-label="Diminuir">−</button><input value="${i.quantidade}" readonly aria-label="Quantidade"><button type="button" data-idx="${idx}" data-d="1" aria-label="Aumentar">+</button></div>
                  <button class="link-btn" data-remover="${idx}">Remover</button>
                </div>
              </div>
              <strong>${brl(i.preco_cents * i.quantidade)}</strong>
            </div>`).join('')}
        </div>
        <aside class="caixa resumo">
          <h3>Resumo</h3>
          <div class="linha"><span>Subtotal</span><span>${brl(carrinho.subtotal())}</span></div>
          <div class="linha"><span>Entrega</span><span class="suave">calculada no próximo passo</span></div>
          <div class="linha total"><span>Total</span><span>${brl(carrinho.subtotal())}</span></div>
          <a class="btn bloco" href="/checkout" style="margin-top:1.2rem"><span>Finalizar compra</span></a>
          <a href="/produtos" class="suave" style="display:block;text-align:center;margin-top:1rem;font-size:.9rem">Continuar comprando</a>
        </aside>
      </div>`;
  }
  document.addEventListener('click', (e) => {
    const b = e.target.closest('[data-d]');
    if (b) { const i = carrinho.ler()[b.dataset.idx]; carrinho.alterar(Number(b.dataset.idx), i.quantidade + Number(b.dataset.d)); render(); }
    const r = e.target.closest('[data-remover]');
    if (r) { carrinho.alterar(Number(r.dataset.remover), 0); render(); }
  });
  render();
</script>
</body>
</html>
